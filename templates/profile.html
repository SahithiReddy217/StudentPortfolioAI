
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Your Profile | PortfolioAI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f5f6fc;
            color: #202544;
        }

        header {
            background: #6555e9;
            color: white;
            padding: 24px 8%;
        }

        header a {
            color: white;
            text-decoration: none;
        }

        main {
            max-width: 850px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .form-card {
            background: white;
            padding: 32px;
            border-radius: 16px;
            box-shadow: 0 8px 30px #20254410;
        }

        h1 {
            margin-top: 0;
        }

        .intro {
            color: #727790;
            line-height: 1.6;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 25px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .full {
            grid-column: 1 / -1;
        }

        label {
            font-weight: 600;
            font-size: 14px;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #dfe1ed;
            border-radius: 8px;
            font: inherit;
        }

        input:focus, textarea:focus {
            outline: 2px solid #c6c0ff;
            border-color: #6555e9;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        button {
            margin-top: 25px;
            background: #6555e9;
            color: white;
            padding: 14px 22px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: #5040d0;
        }

        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: auto;
            }

            .form-card {
                padding: 22px;
            }
        }
    </style>
</head>

<body>
    <header>
        <a href="/">← PortfolioAI</a>
    </header>

    <main>
        <div class="form-card">
            <h1>Create Your Student Profile</h1>
            <p class="intro">
                Add your details to start building your professional portfolio.
            </p>

            <form action="/save-profile" method="POST">
                <div class="form-grid">

                    <div class="field">
                        <label for="name">Full Name *</label>
                        <input id="name" name="name"
                               placeholder="Enter your name" required>
                    </div>

                    <div class="field">
                        <label for="email">Email *</label>
                        <input id="email" name="email" type="email"
                               placeholder="you@example.com" required>
                    </div>

                    <div class="field">
                        <label for="college">College Name</label>
                        <input id="college" name="college"
                               placeholder="Your college">
                    </div>

                    <div class="field">
                        <label for="degree">Degree / Branch</label>
                        <input id="degree" name="degree"
                               placeholder="B.Tech - CSM">
                    </div>

                    <div class="field">
                        <label for="year">Study Year</label>
                        <select id="year" name="year">
                            <option value="">Select year</option>
                            <option>1st Year</option>
                            <option>2nd Year</option>
                            <option>3rd Year</option>
                            <option>4th Year</option>
                        </select>
                    </div>

                    <div class="field">
                        <label for="career">Target Career</label>
                        <select id="career" name="career">
                            <option value="">Select a role</option>
                            <option>Python Developer</option>
                            <option>Java Developer</option>
                            <option>Data Analyst</option>
                            <option>Machine Learning Engineer</option>
                            <option>Web Developer</option>
                        </select>
                    </div>

                    <div class="field full">
                        <label for="skills">Technical Skills</label>
                        <input id="skills" name="skills"
                               placeholder="Python, Java, SQL">
                    </div>

                    <div class="field full">
                        <label for="objective">Career Objective</label>
                        <textarea id="objective" name="objective"
                                  placeholder="Describe your interests and career goals"></textarea>
                    </div>

                    <div class="field">
                        <label for="github">GitHub Profile URL</label>
                        <input id="github" name="github"
                               type="url" placeholder="https://github.com/username">
                    </div>

                    <div class="field">
                        <label for="linkedin">LinkedIn Profile URL</label>
                        <input id="linkedin" name="linkedin"
                               type="url" placeholder="https://linkedin.com/in/username">
                    </div>

                </div>

                <button type="submit">Save My Profile →</button>
            </form>
        </div>
    </main>
</body>
</html>
